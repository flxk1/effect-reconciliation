[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "effect-reconciliation"
version = "0.2.0"
description = "Reconcile permissions granted against effects observed — the missing second entry in governance's single-entry book."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "flxk1" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
effect_reconciliation = ["py.typed"]
